# Mapa de prueba para la primera habilidad metroidvania: Doble Salto (Etapa 1).
# 1×1 chunk (320×184 px). Sin la reliquia no se alcanza la repisa alta (y=96, 64 px sobre el piso).
name: ability
size_chunks: [1, 1]

fill:
  VIS: 0

rects:
  # Techo, piso y paredes
  - {layer: COL, x: 0,  y: 0,  w: 40, h: 3,  tile: 1}
  - {layer: VIS, x: 0,  y: 0,  w: 40, h: 3,  tile: 15}
  - {layer: COL, x: 0,  y: 20, w: 40, h: 3,  tile: 1}
  - {layer: VIS, x: 0,  y: 20, w: 40, h: 3,  tile: 17}
  - {layer: COL, x: 0,  y: 0,  w: 1,  h: 23, tile: 1}
  - {layer: VIS, x: 0,  y: 0,  w: 1,  h: 23, tile: 15}
  - {layer: COL, x: 39, y: 0,  w: 1,  h: 23, tile: 1}
  - {layer: VIS, x: 39, y: 0,  w: 1,  h: 23, tile: 15}
  # Repisa alta (tiles 24..38, techo de repisa en y=96 px = 64 px arriba del piso y=160)
  - {layer: COL, x: 24, y: 12, w: 15, h: 1,  tile: 1}
  - {layer: VIS, x: 24, y: 12, w: 15, h: 1,  tile: 5}
  # Zona de meta en la repisa alta
  - {layer: META, x: 35, y: 9, w: 3,  h: 3,  tile: 3}

entities:
  - {name: spawn,  type: player_spawn,        x: 32,  y: 152}
  - {name: rel_dj, type: ability_double_jump, x: 120, y: 152}
  - {name: ck_top, type: checkpoint,          x: 224, y: 88}
  - {name: goal,   type: goal,                x: 288, y: 88}

ropes:
  - {x: 72, y: 24, segments: 10, seg_len: 6}

backdrops:
  - {cx: 0, cy: 0, theme: nido}
