# Mapa de prueba para la mecánica de plataformas móviles (no es una sala de slice).
# Un mover horizontal (carry / colisión) y un lift que sube contra un techo (aplastamiento),
# más una cuerda y una pileta chica para verificar que no se rompen.
name: mover
size_chunks: [1, 1]
rects:
  - {layer: COL, x: 0, y: 0, w: 1, h: 23, tile: 1}
  - {layer: COL, x: 39, y: 0, w: 1, h: 23, tile: 1}
  - {layer: COL, x: 0, y: 20, w: 40, h: 3, tile: 1}
  - {layer: VIS, x: 0, y: 0, w: 1, h: 23, tile: 15}
  - {layer: VIS, x: 39, y: 0, w: 1, h: 23, tile: 15}
  - {layer: VIS, x: 0, y: 20, w: 40, h: 3, tile: 17}
  # Techo contra el que el lift aplasta (y=64..72 px).
  - {layer: COL, x: 32, y: 8, w: 7, h: 1, tile: 1}
  - {layer: VIS, x: 32, y: 8, w: 7, h: 1, tile: 15}
entities:
  - {name: spawn, type: player_spawn, x: 32, y: 152}
  - {name: plat, type: mover, x: 96, y: 128, w: 3, h: 1, to_x: 216, to_y: 128, speed: 80, pause: 0.25, tile: 6}
  - {name: lift, type: mover, x: 264, y: 136, w: 3, h: 1, to_x: 264, to_y: 64, speed: 80, pause: 0.25, tile: 6}
ropes:
  - {x: 48, y: 24, segments: 8, seg_len: 6}
water:
  - {x: 16, y: 32, w: 24, h: 16, stiffness: 0.02, damping: 0.04}
