# Mapa de prueba para la habilidad de Embestida (Dash) y muros rompibles (Etapa 7).
# 1×1 chunk (320×184 px). Sin Dash el break_wall en x=160 (tx=20, ty=17..19) bloquea el paso a la meta.
name: dash
size_chunks: [1, 1]

fill:
  VIS: 0

rects:
  # Techo, piso y paredes exteriores
  - {layer: COL, x: 0,  y: 0,  w: 40, h: 3,  tile: 1}
  - {layer: VIS, x: 0,  y: 0,  w: 40, h: 3,  tile: 15}
  - {layer: COL, x: 0,  y: 20, w: 40, h: 3,  tile: 1}
  - {layer: VIS, x: 0,  y: 20, w: 40, h: 3,  tile: 17}
  - {layer: COL, x: 0,  y: 0,  w: 1,  h: 23, tile: 1}
  - {layer: VIS, x: 0,  y: 0,  w: 1,  h: 23, tile: 15}
  - {layer: COL, x: 39, y: 0,  w: 1,  h: 23, tile: 1}
  - {layer: VIS, x: 39, y: 0,  w: 1,  h: 23, tile: 15}
  # Muro sólido superior sobre el umbral del break_wall (tx=20, ty=3..16)
  - {layer: COL, x: 20, y: 3,  w: 1,  h: 14, tile: 1}
  - {layer: VIS, x: 20, y: 3,  w: 1,  h: 14, tile: 15}
  # Zona de meta tras el muro rompible
  - {layer: META, x: 34, y: 17, w: 3, h: 3,  tile: 3}

entities:
  - {name: spawn,      type: player_spawn, x: 32,  y: 152}
  - {name: rel_dash,   type: ability_dash, x: 96,  y: 152}
  - {name: wall_gate,  type: break_wall,   x: 160, y: 136}
  - {name: sw_demo,    type: switch,       x: 208, y: 152}
  - {name: ck_beyond,  type: checkpoint,   x: 248, y: 152}
  - {name: goal,       type: goal,         x: 280, y: 152}

ropes:
  - {x: 64, y: 24, segments: 10, seg_len: 6}

backdrops:
  - {cx: 0, cy: 0, theme: guarida}
