dialogs:
  - {entity: npc_vigia,        trigger: interact, speaker: "VIGIA DEL UMBRAL",            text: "LA ORDEN ENCERRO AL WYRM/BAJO TRES SELLOS ANTIGUOS.|SIN FUEGO DE DRAGON ARRIBA,/EL MUNDO SE HIELA EN SOMBRA.|LLEVA TU LLAMA A LO PROFUNDO:/ROMPE LOS SELLOS Y SALVALOS."}
  - {entity: egg_pozo_secreto, trigger: pickup,   speaker: "NIDADA DE LA CUMBRE",         text: "ESCONDIDA EN LO ALTO DEL POZO/SU CASCARA GUARDA ECOS TIBIOS.|TU LLAMA DESPIERTA AL DRAGON/QUE LA ORDEN QUISO APAGAR."}
  - {entity: lore_techo,       trigger: interact, speaker: "ESTELA DE LA BOVEDA",         text: "OCHO NIDADAS DISPERSO LA ORDEN/DESDE EL POZO AL CAMPANARIO.|REUNELAS TODAS EN EL NIDO/PARA QUE RENAZCA LA ESTIRPE."}
  - {entity: egg_well,         trigger: pickup,   speaker: "NIDADA DE BRONCE",            text: "EL HUEVO DEL POZO RESPIRA:/UNA BRASA ANTIGUA DESPIERTA|Y RECONOCE TU LLAMA VIVA./NO SON PIEDRAS: SON DRAGONES."}
  - {entity: npc_cronista,     trigger: interact, speaker: "CRONISTA DE LA CRIPTA",       text: "HAS ROTO EL SELLO DE PIEDRA,/MAS QUEDAN SOMBRA Y AGUA.|BAJA AL FOSO POR LAS RELIQUIAS/ANTES DE RETAR AL GUARDIAN."}
  - {entity: egg_cat_1,        trigger: pickup,   speaker: "NIDADA DE LA CRIPTA",         text: "ARRANCADA DEL NIDO DEL WYRM,/FUE SELLADA ENTRE CENIZAS.|TU CALOR DEVUELVE EL PULSO/AL FUTURO DE LOS ALADOS."}
  - {entity: rel_double_jump,  trigger: pickup,   speaker: "RELIQUIA: ALAS DE DRAGON",    text: "ALAS DE CRIA ENVUELVEN TU SER/Y TE ELEVAN EN EL AIRE.|PULSA SALTO EN PLENO VUELO/PARA ALCANZAR REPISAS ALTAS."}
  - {entity: lore_santuario2,  trigger: interact, speaker: "ESTELA DEL SANTUARIO",        text: "TRES COLOSOS FORJO LA VIGIA:/PIEDRA, SOMBRA Y AGUA FRIA.|ACTIVA LA PALANCA DEL ALTAR/PARA ABRIR EL PASO SUPERIOR."}
  - {entity: egg_cat_2,        trigger: pickup,   speaker: "NIDADA DE BRASA",             text: "SU CASCARA ARDE SIN QUEMAR:/LATEN ALAS BAJO LA ROCA.|LA ORDEN TEMIA QUE SU FUEGO/FUNDIESE LOS TRES SELLOS."}
  - {entity: rel_dash,         trigger: pickup,   speaker: "RELIQUIA: GARRA DE BRASA",    text: "EL IMPETU DRACONICO ARDE/EN CADA EMBESTIDA TUYA!|PULSA E, X O K PARA EMBESTIR/Y QUEBRAR MUROS AGRIETADOS."}
  - {entity: npc_centinela,    trigger: interact, speaker: "CENTINELA DISIDENTE",         text: "AL OESTE AGUARDA EL PORTICO/QUE ENCIERRA AL VIEJO WYRM.|AUN FALTA EL SELLO DEL AGUA:/BAJA AL SANTUARIO Y AL ARCHIVO|PARA LIBERAR A LA SIERPE/DE SU LARGO TORMENTO."}
  - {entity: egg_wyrm_1,       trigger: pickup,   speaker: "NIDADA DEL UMBRAL",           text: "TAN CERCA DEL WYRM CAUTIVO,/ESTA CRIA OIA SU LAMENTO.|AL SENTIR TU LLAMA CERCANA,/SU ESCAMA VUELVE A BRILLAR."}
  - {entity: lore_wyrm,        trigger: interact, speaker: "CRONICA DEL WYRM",            text: "SIGLOS DE CADENAS NUBLARON/LA MENTE DEL NOBLE WYRM.|CUATRO GOLPES EN SU CORONA/ROMPERAN SU YUGO DE DOLOR.|USA DASH ENTRE SUS BRASAS/Y BAJA AL POZO DEL ARCHIVO."}
  - {entity: egg_wyrm_2,       trigger: pickup,   speaker: "NIDADA DEL SANTUARIO",        text: "OTRAS DOS NIDADAS YACEN ABAJO/EN EL ARCHIVO Y EL CAMPANARIO.|BAJA A LAS AGUAS PROFUNDAS/PARA REUNIR A TODA LA PROLE."}
  - {entity: rel_wall_climb,   trigger: pickup,   speaker: "RELIQUIA: GARRAS DEL POZO",   text: "GARRAS DE PIEDRA DRACONICA!/DESLIZATE Y SALTA ENTRE MUROS.|ESCALA LAS CHIMENEAS PROFUNDAS/Y LA BOVEDA ALTA DEL INICIO!"}
  - {entity: lore_abismo,      trigger: interact, speaker: "ESTELA DEL PUENTE ANTIGUO",   text: "ANTES DE LA ORDEN, LOS ALADOS/CRUZABAN LIBRES ESTE ABISMO.|ROMPE LOS TRES SELLOS DE ABAJO/Y LIBERA AL WYRM EN EL NIDO."}
  - {entity: lore_wyrm_seal,   trigger: interact, speaker: "PORTICO DE LOS TRES SELLOS",  text: "TRES SELLOS GUARDAN AL WYRM:/PIEDRA, SOMBRA Y AGUA PROFUNDA|ROMPE EL SELLO DEL ARCHIVO/DESCENDIENDO POR EL SANTUARIO.|SOLO ENTONCES SE ABRIRA/EL CAMINO AL NIDO PRIMORDIAL."}
  - {entity: aq_lore_archivo,  trigger: interact, speaker: "ESTELA DEL ARCHIVO",          text: "LA ORDEN INUNDO ESTAS BOVEDAS/PARA AHOGAR EL TERCER SELLO.|QUIEBRA EL CRISTAL CON DASH/Y AVANZA HACIA LA GRAN PRESA."}
  - {entity: egg_archivo,      trigger: pickup,   speaker: "NIDADA DEL ARCHIVO",          text: "NI EL AGUA HELADA APAGO/LA BRASA DENTRO DEL CRISTAL.|SU LATIDO RESPONDE AL TUYO:/LA ESTIRPE RECUERDA EL SOL."}
  - {entity: aq_lore_presa,    trigger: interact, speaker: "ESTELA DE LA PRESA",          text: "LA PRESA GUARDA EL PASO/HACIA EL CENTINELA DEL AGUA.|MAS ALLA, EL POZO DEL ESTE/BAJA AL CAMPANARIO HUNDIDO."}
  - {entity: lore_sentinel,    trigger: interact, speaker: "ESTELA DEL CENTINELA",        text: "ESTE COLOSO ACUATICO CUSTODIA/EL TERCER SELLO DE LA ORDEN.|TRES GOLPES SOBRE SU CORONA/QUEBRARAN EL SELLO DEL AGUA."}
  - {entity: lore_sello_agua,  trigger: interact, speaker: "ALTAR DEL SELLO ROTO",        text: "EL SELLO DEL AGUA HA CAIDO!/EL PORTICO ARRIBA SE ABRE.|BAJA AL ESTE POR LA RELIQUIA/O SUBE A LIBERAR AL WYRM!"}
  - {entity: tw_lore_campana,  trigger: interact, speaker: "CAMPANA DEL LETARGO",         text: "CON SU ECO LA ORDEN ADORMECIO/A LAS NIDADAS DEL SUBSUELO.|AL OESTE REPOSA LA LLAMA/QUE REVELA SUS PASOS OCULTOS."}
  - {entity: egg_torre,        trigger: pickup,   speaker: "NIDADA DEL CAMPANARIO",       text: "DORMIDA POR LA GRAN CAMPANA,/DESPIERTA AL CESAR EL REPIQUE.|TU LLAMA DISIPA EL LETARGO/IMPUESTO POR LA VIEJA ORDEN."}
  - {entity: lore_altar_oeste, trigger: interact, speaker: "ALTAR DE LA VIGIA",           text: "AQUI OCULTO LA ORDEN LA LUZ/QUE DESVELA SU ARQUITECTURA.|TOMA LA RELIQUIA Y MIRA ATRAS:/ESCALONES TE ALZAN AL ARCHIVO!"}
  - {entity: rel_reveal,       trigger: pickup,   speaker: "RELIQUIA: LLAMA REVELADORA",  text: "TU LLAMA AHORA DESVELA/LA PIEDRA ESPECTRAL OCULTA!|ACERCATE A LOS BLOQUES TENUES/PARA HACERLOS ROCA SOLIDA."}

