# slice.yaml — vertical slice: camino start → goal (6×1 chunks).
# Cada chunk = 1 pantalla (40×23 tiles de 8 px = 320×184 px).
#
# Chunk 0 (x 0–319): spawn, switch → puerta, pileta (nadar). Seam en x=320.
# Chunk 1 (x 320–639): cuerda para subir una pared alta, cornisa. Seam en x=640.
# Chunk 2 (x 640–959): cornisa, hueco con pinchos (META 4), flood_switch.
# Chunk 3 (x 960–1279): pileta que sube con el switch, cornisa de salida.
#   Debajo de la cornisa: pasillo (y 72–160) cerrado por 2 puertas en la pared de la pileta.
# Chunk 4 (x 1280–1599): sala del huevo (opcional). Con el agua BAJA, el switch_well (dentro
#   de la pileta) abre las puertas; se nada al pasillo, se camina a la cuerda 2, se trepa a la
#   repisa y se agarra el huevo (collectible). Desde la cornisa de salida también se llega
#   por arriba (saltando el hueco de la cuerda). HUD: huevos x/1. El goal NO requiere el huevo.
#   La repisa sigue por un hueco en la pared derecha (tile 199, filas 0–7) hacia la sala 4.
# Chunk 5 (x 1600–1919): sala 4, plataformas móviles (mover). Checkpoint en la repisa de
#   entrada; foso de pinchos en todo el piso; plataforma horizontal → pilar → ascensor vertical
#   que baja al piso seguro de la derecha, donde está la meta.
# Checkpoint en la cornisa (tras la cuerda): muerte / R corto vuelve ahí; R largo al spawn.
name: slice
size_chunks: [6, 1]

# autotile: true  (default) — VIS/FG pasan a familia*16+máscara de 4 vecinos
fill:
  VIS: 0

rects:
  # piso continuo (los 6 chunks) y paredes laterales
  - {layer: COL, x: 0,   y: 20, w: 240, h: 3, tile: 1}
  - {layer: VIS, x: 0,   y: 20, w: 240, h: 3, tile: 17}
  - {layer: COL, x: 0,   y: 0,  w: 1,   h: 23, tile: 1}
  - {layer: VIS, x: 0,   y: 0,  w: 1,   h: 23, tile: 17}
  - {layer: COL, x: 239, y: 0,  w: 1,   h: 23, tile: 1}
  - {layer: VIS, x: 239, y: 0,  w: 1,   h: 23, tile: 17}
  # pared entre la sala 3 y la 4: abierta arriba de la repisa (filas 0–7)
  - {layer: COL, x: 199, y: 8,  w: 1,   h: 15, tile: 1}
  - {layer: VIS, x: 199, y: 8,  w: 1,   h: 15, tile: 17}

  # chunk 0: pileta (META 2 = agua) entre tiles 28 y 37, después de la puerta (x=200)
  - {layer: META, x: 29, y: 17, w: 8, h: 3, tile: 2}
  - {layer: COL,  x: 28, y: 17, w: 1, h: 3, tile: 1}
  - {layer: VIS,  x: 28, y: 17, w: 1, h: 3, tile: 17}
  - {layer: COL,  x: 37, y: 17, w: 1, h: 3, tile: 1}
  - {layer: VIS,  x: 37, y: 17, w: 1, h: 3, tile: 17}

  # chunk 1: pared alta que no se salta (tiles 50–51, y=8..19 = 96 px de alto)
  - {layer: COL, x: 50, y: 8,  w: 2,  h: 12, tile: 1}
  - {layer: VIS, x: 50, y: 8,  w: 2,  h: 12, tile: 17}
  # cornisa a la derecha de la pared: y=8 (tope = 64 px), desde tile 52 hasta 100 (luego la pileta)
  - {layer: COL, x: 52, y: 8,  w: 49, h: 1,  tile: 3}
  - {layer: VIS, x: 52, y: 8,  w: 49, h: 1,  tile: 5}
  # atlas: columnas de fondo (sin COL)
  - {layer: VIS, x: 44, y: 4,  w: 2,  h: 16, tile: 9}
  - {layer: VIS, x: 108, y: 0, w: 2,  h: 8,  tile: 21}
  # FG de decorado (se dibuja cuando haya soporte de capa FG en el renderer)
  - {layer: FG,  x: 104, y: 0, w: 4,  h: 6,  tile: 13}

  # Hueco en la cornisa (tiles 78–81, x=624–656): hay que saltarlo.
  # Debajo, un pozo con pinchos (META 4) ancho (la caída aterriza ~50 px más a la derecha).
  - {layer: COL,  x: 78, y: 8,  w: 4,  h: 1,  tile: 0}
  - {layer: VIS,  x: 78, y: 8,  w: 4,  h: 1,  tile: 0}
  - {layer: COL,  x: 76, y: 9,  w: 1,  h: 11, tile: 1}   # paredes del pozo
  - {layer: VIS,  x: 76, y: 9,  w: 1,  h: 11, tile: 17}
  - {layer: COL,  x: 92, y: 9,  w: 1,  h: 11, tile: 1}
  - {layer: VIS,  x: 92, y: 9,  w: 1,  h: 11, tile: 17}
  - {layer: META, x: 76, y: 19, w: 17, h: 2,  tile: 4}    # peligro: al caer, muerte
  - {layer: VIS,  x: 77, y: 20, w: 15, h: 1,  tile: 11}   # piso con look de pinchos

  # Pileta de inundación (chunk 2–3): cornisa termina en tile 100, sale en 142.
  # Superficie inicial y=136 (no se alcanza la cornisa); el flood_switch la sube a y=72.
  - {layer: COL,  x: 100, y: 9,  w: 1,  h: 11, tile: 1}
  - {layer: VIS,  x: 100, y: 9,  w: 1,  h: 11, tile: 17}
  # pared derecha de la pileta: sólida en y 9–13; y 14–19 son 2 puertas (door_well_*)
  - {layer: COL,  x: 141, y: 9,  w: 1,  h: 5,  tile: 1}
  - {layer: VIS,  x: 141, y: 9,  w: 1,  h: 5,  tile: 17}
  - {layer: META, x: 101, y: 17, w: 40, h: 3,  tile: 2}   # agua (documentación)
  - {layer: COL,  x: 142, y: 8,  w: 24, h: 1,  tile: 3}   # cornisa de salida (techo del pasillo)
  - {layer: VIS,  x: 142, y: 8,  w: 24, h: 1,  tile: 5}

  # chunk 4: sala del huevo. Misma geometría que la cuerda del chunk 1 (+120 tiles):
  # hueco en la cornisa (tiles 166–169) por donde cuelga la cuerda 2, pared alta (170–171,
  # 96 px) y repisa (172–198, tope y=64) con el huevo. El hueco se salta para volver a la meta.
  - {layer: COL, x: 170, y: 8,  w: 2,  h: 12, tile: 1}
  - {layer: VIS, x: 170, y: 8,  w: 2,  h: 12, tile: 17}
  - {layer: COL, x: 172, y: 8,  w: 27, h: 1,  tile: 3}
  - {layer: VIS, x: 172, y: 8,  w: 27, h: 1,  tile: 5}
  - {layer: VIS, x: 184, y: 9,  w: 2,  h: 11, tile: 9}    # columna de fondo bajo la repisa

  # chunk 5: sala 4 (movers). Repisa de entrada (tiles 200–205, tope y=64) con checkpoint;
  # el piso entero (200–228) es foso de pinchos. plat_h va y viene entre la repisa y el
  # pilar (223–225, tope y=64); lift_v baja del tope del pilar (y=64) a y=136, sobre el piso
  # seguro (229–238). La meta está en ese piso.
  - {layer: COL,  x: 200, y: 8,  w: 6,  h: 1,  tile: 3}
  - {layer: VIS,  x: 200, y: 8,  w: 6,  h: 1,  tile: 5}
  - {layer: COL,  x: 223, y: 8,  w: 3,  h: 12, tile: 1}
  - {layer: VIS,  x: 223, y: 8,  w: 3,  h: 12, tile: 17}
  - {layer: META, x: 200, y: 19, w: 29, h: 2,  tile: 4}
  - {layer: VIS,  x: 200, y: 20, w: 23, h: 1,  tile: 11}
  - {layer: VIS,  x: 226, y: 20, w: 3,  h: 1,  tile: 11}
  - {layer: META, x: 234, y: 17, w: 4,  h: 3,  tile: 3}    # zona de meta

entities:
  - {name: spawn,        type: player_spawn, x: 32,   y: 152}
  - {name: switch_start, type: switch,       x: 96,   y: 152}
  - {name: door_start,   type: door,         x: 200,  y: 136}
  - {name: ck_ledge,     type: checkpoint,   x: 536,  y: 56}
  - {name: flood,        type: flood_switch, x: 776,  y: 56}
  - {name: ck_exit,      type: checkpoint,   x: 1152, y: 56}
  - {name: switch_well,  type: switch,       x: 1112, y: 136}  # dentro de la pileta (agua baja)
  - {name: door_well_hi, type: door,         x: 1128, y: 112}
  - {name: door_well_lo, type: door,         x: 1128, y: 136}
  - {name: egg_well,     type: collectible,  x: 1440, y: 56}   # sobre la repisa del chunk 4
  # sala 4 (chunk 5)
  - {name: ck_mover,     type: checkpoint,   x: 1620, y: 56}
  - {name: plat_h,       type: mover,        x: 1648, y: 64, w: 3, h: 1, to_x: 1760, to_y: 64, speed: 48, pause: 0.6, tile: 6}
  - {name: lift_v,       type: mover,        x: 1808, y: 64, w: 3, h: 1, to_x: 1808, to_y: 136, speed: 40, pause: 0.8, tile: 6}
  - {name: goal,         type: goal,         x: 1888, y: 152}

links:
  - {from: switch_start, to: door_start}
  - {from: switch_well,  to: door_well_hi}
  - {from: switch_well,  to: door_well_lo}

ropes:
  # ancla a la izquierda de la pared (tile 50 = x=400). 16×6 = 96 px, punta en y=120.
  - {x: 392, y: 24, segments: 16, seg_len: 6}
  # cuerda 2 (chunk 4): por el hueco de la cornisa, a la izquierda de la pared (tile 170 = x 1360)
  - {x: 1352, y: 24, segments: 16, seg_len: 6}

water:
  # entre tiles 29 y 36 (paredes 28 y 37): 232–296 px, superficie y=136, fondo y=160
  - {x: 232, y: 136, w: 64, h: 24, stiffness: 0.02, damping: 0.04}
  # pileta de inundación (tiles 101–140, x=808–1128)
  - {x: 808, y: 136, w: 320, h: 24, stiffness: 0.02, damping: 0.04}
