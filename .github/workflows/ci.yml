name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEW_BUILD_ENGINE=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Compile example maps (CRC always on)
        run: |
          mkdir -p assets/maps/bin
          ./build/ewmapc --crc assets/maps/src/hello.yaml -o assets/maps/bin/hello.ewmap
          ./build/ewmap_smoke assets/maps/bin/hello.ewmap --name hello --chunks 2 --ents 3 --links 1 --water 2 --ropes 2 --has player_spawn --has switch --has door
          ./build/ewmapc --crc assets/maps/src/slice.yaml -o assets/maps/bin/slice.ewmap
          ./build/ewmap_smoke assets/maps/bin/slice.ewmap --name slice --chunks 8 --ents 22 --links 4 --water 2 --ropes 2 --movers 3 --backdrops 8 --dialogs 2 --has mover --has gravity_flip --has boss --has player_spawn --has switch --has door --has goal --has checkpoint --has flood_switch --has collectible --has npc
          ./build/ewmapc --crc assets/maps/src/room.yaml -o assets/maps/bin/room.ewmap
          ./build/ewmap_smoke assets/maps/bin/room.ewmap --name room --chunks 1 --ents 2 --has player_spawn --has goal
          ./build/ewmapc --crc assets/maps/src/mover.yaml -o assets/maps/bin/mover.ewmap
          ./build/ewmap_smoke assets/maps/bin/mover.ewmap --name mover --chunks 1 --ents 3 --ropes 1 --water 1 --movers 2 --has player_spawn --has mover
          ./build/ewmapc --crc assets/maps/src/gravity.yaml -o assets/maps/bin/gravity.ewmap
          ./build/ewmap_smoke assets/maps/bin/gravity.ewmap --name gravity --chunks 1 --ents 6 --ropes 1 --water 1 --movers 2 --has player_spawn --has gravity_flip --has checkpoint --has mover
          ./build/ewmapc --crc assets/maps/src/boss.yaml -o assets/maps/bin/boss.ewmap
          ./build/ewmap_smoke assets/maps/bin/boss.ewmap --name boss --chunks 1 --ents 5 --links 1 --has player_spawn --has boss --has door --has goal --has checkpoint
          ./build/ewmapc --crc assets/maps/src/ability.yaml -o assets/maps/bin/ability.ewmap
          ./build/ewmap_smoke assets/maps/bin/ability.ewmap --name ability --chunks 1 --ents 4 --ropes 1 --backdrops 1 --has player_spawn --has ability_double_jump --has checkpoint --has goal
          ./build/ewmapc --crc assets/maps/src/dash.yaml -o assets/maps/bin/dash.ewmap
          ./build/ewmap_smoke assets/maps/bin/dash.ewmap --name dash --chunks 1 --ents 6 --ropes 1 --backdrops 1 --has player_spawn --has ability_dash --has break_wall --has switch --has checkpoint --has goal
          ./build/ewmapc --crc assets/maps/src/level2.yaml -o assets/maps/bin/level2.ewmap
          ./build/ewmap_smoke assets/maps/bin/level2.ewmap --name level2 --chunks 8 --ents 22 --links 2 --water 1 --ropes 1 --movers 1 --backdrops 8 --dialogs 6 --has player_spawn --has ability_double_jump --has ability_dash --has break_wall --has collectible --has switch --has door --has mover --has gravity_flip --has boss --has checkpoint --has goal --has npc --has lore
          ./build/ewmapc --crc assets/maps/src/level3.yaml -o assets/maps/bin/level3.ewmap
          ./build/ewmap_smoke assets/maps/bin/level3.ewmap --name level3 --chunks 6 --ents 22 --links 2 --water 1 --ropes 1 --movers 1 --backdrops 6 --dialogs 4 --has player_spawn --has ability_double_jump --has ability_dash --has break_wall --has collectible --has switch --has door --has mover --has gravity_flip --has boss_dragon --has imp --has checkpoint --has goal --has npc --has lore

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEW_BUILD_ENGINE=OFF -DEW_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (incluye fuzz smoke)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure (clang + libFuzzer + ASan/UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEW_BUILD_ENGINE=OFF -DEW_SANITIZE=ON -DEW_LIBFUZZER=ON -DCMAKE_CXX_COMPILER=clang++
      - name: Build fuzz targets
        run: cmake --build build -j --target fuzz_map_loader fuzz_yaml_lite fuzz_atlas fuzz_save
      - name: Fuzz MapLoader (.ewmap) 60s
        run: |
          mkdir -p work/ewmap && cp tests/fuzz/corpus/ewmap/* work/ewmap/
          ./build/fuzz_map_loader -max_total_time=60 -max_len=65536 work/ewmap
      - name: Fuzz yaml_lite 60s
        run: |
          mkdir -p work/yaml && cp tests/fuzz/corpus/yaml/* work/yaml/
          ./build/fuzz_yaml_lite -max_total_time=60 -max_len=8192 work/yaml
      - name: Fuzz atlas PNG 60s
        run: |
          mkdir -p work/png && cp tests/fuzz/corpus/png/* work/png/
          ./build/fuzz_atlas -max_total_time=60 -max_len=65536 work/png
      - name: Fuzz save (.ewsv) 60s
        run: |
          mkdir -p work/save && cp tests/fuzz/corpus/save/* work/save/
          ./build/fuzz_save -max_total_time=60 -max_len=4096 work/save
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deps (OpenGL/X11 + xvfb)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb mesa-utils
      - name: Configure + build (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Smoke run headless + dump PPM
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -s "-screen 0 1600x900x24"             ./build/echo_engine --frames 90 --demo --dump frame.ppm --nosound
          python3 - <<'PY'
          from pathlib import Path
          b = Path("frame.ppm").read_bytes()
          hdr = b"P6\n320 180\n255\n"
          assert b.startswith(hdr), b[:40]
          assert len(b) == len(hdr) + 320 * 180 * 3, len(b)
          print("frame.ppm OK", len(b), "bytes")
          PY
      - name: Fondos de las salas (capturas + chequeo vs fondo liso)
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -s "-screen 0 1600x900x24" python3 tools/room_shots.py build fondos
      - name: Upload capturas de fondos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fondos-salas
          path: fondos/sala*.ppm
          if-no-files-found: error
      - name: Smoke partida guardada (menú abre en CONTINUAR)
        run: |
          mkdir -p savedir
          ./build/save_test build/maps/slice.ewmap savedir/save.ewsv
          EW_SAVE_DIR=$PWD/savedir LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -s "-screen 0 1600x900x24" \
            ./build/echo_engine --frames 30 --dump frame_save.ppm --nosound --nogamepad | tee save_run.log
          grep -q "CONTINUAR en el menú" save_run.log
      - name: Upload screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-frame
          path: frame.ppm
          if-no-files-found: error

  # Builds descargables (solo artifacts de Actions; NO se publican releases ni itch).
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deps (OpenGL/X11 + xvfb)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb mesa-utils
      - name: Configure + build (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Install portable prefix
        run: cmake --install build --prefix dist/echo-well
      - name: Smoke desde el prefix (sin el árbol de fuentes)
        run: |
          mkdir -p /tmp/ew-pack
          cp -a dist/echo-well /tmp/ew-pack/
          ls -la /tmp/ew-pack/echo-well /tmp/ew-pack/echo-well/assets/atlas /tmp/ew-pack/echo-well/assets/maps/bin /tmp/ew-pack/echo-well/assets/shaders
          test -f /tmp/ew-pack/echo-well/echo_engine
          test -f /tmp/ew-pack/echo-well/assets/atlas/tiles.png
          test -f /tmp/ew-pack/echo-well/assets/atlas/sprites.png
          for m in slice hello room mover gravity boss ability dash level2 level3; do test -f /tmp/ew-pack/echo-well/assets/maps/bin/$m.ewmap; done
          test -f /tmp/ew-pack/echo-well/docs/qa-checklist.md
          test -f /tmp/ew-pack/echo-well/DIST.txt
          test -f /tmp/ew-pack/echo-well/assets/shaders/light.frag
          /tmp/ew-pack/echo-well/echo_engine --version | grep -F "v0.1.0"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -s "-screen 0 1600x900x24" \
            /tmp/ew-pack/echo-well/echo_engine --frames 30 --demo --dump /tmp/ew-pack/frame.ppm --nosound --nogamepad \
            > /tmp/ew-pack/run.log 2>&1
          cat /tmp/ew-pack/run.log
          grep -F "atlas PNG /tmp/ew-pack/echo-well/assets/atlas/tiles.png" /tmp/ew-pack/run.log
          python3 - <<'PY'
          from pathlib import Path
          b = Path("/tmp/ew-pack/frame.ppm").read_bytes()
          hdr = b"P6\n320 180\n255\n"
          assert b.startswith(hdr), b[:40]
          print("pack smoke OK", len(b))
          PY
      - name: Zip
        run: python3 -c "import shutil; shutil.make_archive('echo-well-linux-x86_64', 'zip', 'dist', 'echo-well')"
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echo-well-linux-x86_64
          path: echo-well-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 30

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure + build (Release, MSVC)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j
      - name: Install portable prefix
        run: cmake --install build --config Release --prefix dist/echo-well
      - name: Verify layout
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist/echo-well | Select-Object FullName
          if (-not (Test-Path dist/echo-well/echo_engine.exe)) { throw "falta echo_engine.exe" }
          if (-not (Test-Path dist/echo-well/assets/atlas/tiles.png)) { throw "falta tiles.png" }
          if (-not (Test-Path dist/echo-well/assets/atlas/sprites.png)) { throw "falta sprites.png" }
          foreach ($m in 'slice','hello','room','mover','gravity','boss','ability','dash','level2','level3') {
            if (-not (Test-Path "dist/echo-well/assets/maps/bin/$m.ewmap")) { throw "falta $m.ewmap" }
          }
          if (-not (Test-Path dist/echo-well/docs/qa-checklist.md)) { throw "falta docs/qa-checklist.md" }
          if (-not (Test-Path dist/echo-well/DIST.txt)) { throw "falta DIST.txt" }
          $v = & dist/echo-well/echo_engine.exe --version | Out-String
          if ($v -notmatch 'v0\.1\.0') { throw "versión inesperada: $v" }
          if (-not (Test-Path dist/echo-well/assets/shaders/light.frag)) { throw "falta shaders" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/echo-well -DestinationPath echo-well-windows-x86_64.zip
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echo-well-windows-x86_64
          path: echo-well-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
